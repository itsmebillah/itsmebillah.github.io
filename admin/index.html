<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio Control</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=">
  <style>
    :root{color-scheme:light;--bg:#f4f7f5;--panel:#fff;--panel2:#edf3ef;--input:#fff;--sidebar:#f9fbfa;--line:#cbd8d0;--line-strong:#84978b;--text:#152019;--muted:#5c6c62;--green:#087a45;--accent-text:#fff;--amber:#955b00;--red:#b42318;--error:#a61b1b;--notice-bg:#fff8e8;--notice-text:#684800;--success:#087a45;--overlay:rgba(16,24,20,.58);--topbar:rgba(244,247,245,.94);--thumb:#eef2ef}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#080b09;--panel:#101612;--panel2:#151d18;--input:#0b100d;--sidebar:#0b100d;--line:#27342c;--line-strong:#657a6c;--text:#f5f7f5;--muted:#aab8ae;--green:#42dc8c;--accent-text:#04150b;--amber:#f0b54a;--red:#ff7f7f;--error:#ff9292;--notice-bg:#1b180e;--notice-text:#e5cf9f;--success:#8de4b4;--overlay:rgba(0,0,0,.75);--topbar:rgba(8,11,9,.94);--thumb:#080b09}}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#080b09;--panel:#101612;--panel2:#151d18;--input:#0b100d;--sidebar:#0b100d;--line:#27342c;--line-strong:#657a6c;--text:#f5f7f5;--muted:#aab8ae;--green:#42dc8c;--accent-text:#04150b;--amber:#f0b54a;--red:#ff7f7f;--error:#ff9292;--notice-bg:#1b180e;--notice-text:#e5cf9f;--success:#8de4b4;--overlay:rgba(0,0,0,.75);--topbar:rgba(8,11,9,.94);--thumb:#080b09}
    :root[data-theme="light"]{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-panel{width:min(420px,100%);border:1px solid var(--line);background:var(--panel);padding:28px;border-radius:8px}.brand{font-size:20px;font-weight:750}.eyebrow{color:var(--green);font-size:12px;text-transform:uppercase;margin-bottom:6px}.muted{color:var(--muted)}label{display:grid;gap:6px;margin:16px 0 0;font-size:12px;color:var(--muted)}input,textarea,select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px 11px;outline:none}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 20%,transparent)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:9px 12px;font-weight:650}.btn:hover{border-color:var(--line-strong)}.btn.primary{background:var(--green);border-color:var(--green);color:var(--accent-text)}.btn.warn{color:var(--amber)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.55;cursor:not-allowed}.full{width:100%;margin-top:18px}.error{color:var(--error);margin-top:12px;min-height:20px}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--sidebar);padding:20px 12px}.side-brand{padding:0 10px 18px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:9px 10px;border-radius:5px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--green)}.main{min-width:0}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:var(--topbar);z-index:5}.content{padding:24px;max-width:1500px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.heading h1{font-size:24px;margin:0}.heading p{margin:4px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{border-top:2px solid var(--green);background:var(--panel);padding:16px}.metric b{display:block;font-size:25px}.metric span{color:var(--muted);font-size:12px}.band{border:1px solid var(--line);background:var(--panel);padding:16px;margin-top:14px;border-radius:6px}.band h2{font-size:16px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(120px,1fr) auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}.row:last-child{border:0}.row-title{font-weight:700;word-break:break-word}.meta{font-size:12px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-flex;padding:3px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px}.pill.on{color:var(--green);border-color:var(--green)}.pill.warn{color:var(--amber)}.thumb{width:76px;height:44px;object-fit:cover;border:1px solid var(--line);background:var(--thumb)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.form-grid .wide{grid-column:1/-1}.dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);width:min(760px,calc(100% - 24px));border-radius:8px;padding:0}.dialog::backdrop{background:var(--overlay)}.dialog-head,.dialog-foot{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-foot{border:0;border-top:1px solid var(--line);justify-content:flex-end}.dialog-body{padding:0 16px 18px;max-height:70vh;overflow:auto}.notice{padding:12px;border-left:3px solid var(--amber);background:var(--notice-bg);color:var(--notice-text);margin:12px 0}.success{border-color:var(--green);color:var(--success)}.menu{display:none}.empty{padding:30px 8px;color:var(--muted);text-align:center}.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}.theme-control{position:fixed;top:12px;right:12px;z-index:30;display:flex;align-items:center;gap:7px;margin:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted)}.theme-control select{width:auto;min-width:82px;padding:5px 7px;background:var(--input)}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:10;transform:translateX(-100%);transition:.2s;width:240px}.sidebar.open{transform:none}.menu{display:inline-flex}.row{grid-template-columns:1fr}.actions{justify-content:flex-start}}@media(max-width:560px){.content,.topbar{padding-left:14px;padding-right:14px}.grid,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.heading{align-items:stretch;flex-direction:column}.topbar .muted{display:none}.theme-control{top:auto;bottom:10px}}
  </style>
</head>
<body>
  <label class="theme-control">Theme<select id="themeSelect" aria-label="Dashboard theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <section id="loginView" class="auth">
    <form id="loginForm" class="auth-panel">
      <div class="eyebrow">Secure administration</div><div class="brand">Portfolio Control</div>
      <p class="muted">Manage portfolio content, publishing, and synchronization.</p>
      <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="btn primary full" type="submit">Sign in</button><div id="loginError" class="error" role="alert"></div>
    </form>
  </section>

  <section id="passwordView" class="auth hidden">
    <form id="passwordForm" class="auth-panel">
      <div class="eyebrow">Required security step</div><div class="brand">Change temporary password</div>
      <p class="muted">Use at least 6 characters with uppercase, lowercase, number, and symbol.</p>
      <label>Current password<input id="currentPassword" type="password" autocomplete="current-password" required></label>
      <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="6" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{6,}" required></label>
      <label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{6,}" required></label>
      <button class="btn primary full" type="submit">Change password</button><div id="passwordError" class="error" role="alert"></div>
    </form>
  </section>

  <div id="appView" class="shell hidden">
    <aside id="sidebar" class="sidebar"><div class="side-brand"><div class="eyebrow">Masum Billah</div><div class="brand">Portfolio Control</div></div><nav id="nav" class="nav"></nav></aside>
    <main class="main"><header class="topbar"><div><button id="menuButton" class="btn menu" aria-label="Open navigation">Menu</button> <span id="sectionTitle" class="brand">Overview</span></div><div><span id="adminEmail" class="muted"></span> <button id="logoutButton" class="btn">Log out</button></div></header><div id="content" class="content"></div></main>
  </div>

  <dialog id="editor" class="dialog"><form id="editorForm"><div class="dialog-head"><b id="editorTitle">Edit</b><button class="btn" type="button" data-close>Close</button></div><div id="editorBody" class="dialog-body form-grid"></div><div class="dialog-foot"><button class="btn" type="button" data-close>Cancel</button><button id="saveButton" class="btn primary" type="submit">Save</button></div></form></dialog>

  <script>
    (()=>{
      const $=id=>document.getElementById(id);
      let token=''; let active='overview'; let editorSave=null; const cache={};
      const themeKey='portfolio-dashboard-theme';
      const passwordPolicyMessage='Use at least 6 characters with uppercase, lowercase, number, and symbol.';
      const isPasswordValid=value=>String(value||'').length>=6&&/[a-z]/.test(value)&&/[A-Z]/.test(value)&&/[0-9]/.test(value)&&/[^A-Za-z0-9]/.test(value);
      function applyTheme(value){const theme=['light','dark'].includes(value)?value:'system';document.documentElement.toggleAttribute('data-theme',theme!=='system');if(theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);$('themeSelect').value=theme}
      applyTheme(localStorage.getItem(themeKey)||'system');
      $('themeSelect').addEventListener('change',e=>{const value=e.target.value;if(value==='system')localStorage.removeItem(themeKey);else localStorage.setItem(themeKey,value);applyTheme(value)});
      const modules=[['overview','Overview'],['features','Site Features'],['projects','Projects'],['profile','Profile'],['skills','Skills'],['experience','Experience'],['education','Education'],['certificates','Certificates'],['blogs','Blog'],['faq','FAQ'],['config','Configuration'],['media','Media'],['seo','SEO'],['ai','AI / Chat'],['sync','GitHub Sync'],['activity','Activity Log'],['security','Account / Security']];
      const entityFields={
        skills:['Name','Level','Category','Description','Order','Active'],experience:['Title','Company','Period','Description','SkillsUsed','Achievements','Icon','DisplayOrder','Active'],education:['Degree','Institution','Period','Description','Result','Icon','DisplayOrder','Active'],certificates:['Name','Organization','Date','Description','CredentialID','ImageURL','VerifyURL','Skills','Published','DisplayOrder'],blogs:['Title','Slug','Description','Content','Keywords','ReadTime','Thumbnail','Category','DocID','Date','Published','Author','DisplayOrder','SEOTitle','SEODescription'],faq:['Question','Answer','Category','DisplayOrder','Active'],media:['drive_file_id','public_url','alt_text','usage','project_id','mime_type','active','display_order','updated_at'],seo:['scope','entity_id','page_title','meta_description','canonical_url','og_title','og_description','og_image','active','display_order','updated_at'],aiKnowledge:['Type','Title','Content','DisplayOrder','Active']
      };
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      async function call(command,payload={}){const body=new URLSearchParams({action:'admin',request:JSON.stringify({command,payload,token})});const response=await fetch(window.PORTFOLIO_ADMIN_API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});if(!response.ok)throw{message:`Request failed (${response.status})`};const r=await response.json();if(!r||!r.success)throw(r&&r.error||{message:'Request failed'});return r.data}
      function busy(el,on){el.disabled=on;el.dataset.label||=(el.textContent||'');el.innerHTML=on?'<span class="spinner"></span>':esc(el.dataset.label)}
      $('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;busy(b,true);$('loginError').textContent='';try{const r=await call('auth.login',{email:$('loginEmail').value,password:$('loginPassword').value,clientId:navigator.userAgent.slice(0,80)});token=r.token;showSession(r.session)}catch(x){$('loginError').textContent=x.message}finally{busy(b,false)}});
      $('passwordForm').addEventListener('submit',async e=>{e.preventDefault();const next=$('newPassword').value;if(!isPasswordValid(next)){$('passwordError').textContent=passwordPolicyMessage;return}if(next!==$('confirmPassword').value){$('passwordError').textContent='Passwords do not match.';return}const b=e.submitter;busy(b,true);try{const r=await call('auth.changePassword',{currentPassword:$('currentPassword').value,newPassword:next});token=r.token;showSession(r.session)}catch(x){$('passwordError').textContent=x.message}finally{busy(b,false)}});
      $('logoutButton').onclick=async()=>{try{await call('auth.logout')}finally{token='';location.reload()}};
      function showSession(s){$('loginView').classList.add('hidden');$('passwordView').classList.toggle('hidden',!s.mustChangePassword);$('appView').classList.toggle('hidden',s.mustChangePassword);if(!s.mustChangePassword){$('adminEmail').textContent=s.email;buildNav();openModule('overview')}}
      function buildNav(){$('nav').innerHTML=modules.map(([k,n])=>`<button data-module="${k}">${esc(n)}</button>`).join('');$('nav').onclick=e=>{const b=e.target.closest('[data-module]');if(b)openModule(b.dataset.module)}}
      async function openModule(key){active=key;$('sidebar').classList.remove('open');document.querySelectorAll('[data-module]').forEach(x=>x.classList.toggle('active',x.dataset.module===key));$('sectionTitle').textContent=(modules.find(x=>x[0]===key)||[])[1]||key;$('content').innerHTML='<div class="spinner"></div>';try{if(key==='overview')return renderOverview(await call('overview.read'));if(key==='features')return renderSiteFeatures(await call('siteFeatures.list'));if(key==='projects')return renderProjects(await call('projects.list'));if(key==='profile')return renderObject('Profile',await call('profile.read'),'profile.update');if(key==='config')return renderObject('Configuration',await call('config.read'),'config.update');if(key==='ai')return renderAi();if(key==='sync')return renderSync(await call('sync.status'));if(key==='activity')return renderActivity(await call('activity.list'));if(key==='security')return renderSecurity();return renderEntity(key,await call('entity.list',{entity:key}))}catch(x){$('content').innerHTML=`<div class="notice">${esc(x.message)}</div>`}}
      function heading(title,sub,action=''){$('content').innerHTML=`<div class="heading"><div><h1>${esc(title)}</h1><p class="muted">${esc(sub)}</p></div>${action}</div>`}
      function renderOverview(d){heading('Overview','Current portfolio publishing and content health.');const c=d.counts||{};const items=[['Total projects',c.totalProjects],['Published',c.publishedProjects],['Unpublished',(c.totalProjects||0)-(c.publishedProjects||0)],['Featured',c.featuredProjects],['GitHub projects',c.githubProjects],['Manual projects',c.manualProjects],['Skills',c.skills],['Experience',c.experience],['Education',c.education],['Certificates',c.certificates],['Blog posts',c.blogs],['FAQ entries',c.faq]];$('content').innerHTML+=`<div class="grid">${items.map(x=>`<div class="metric"><b>${esc(x[1]||0)}</b><span>${esc(x[0])}</span></div>`).join('')}</div><div class="band"><h2>GitHub synchronization</h2><div class="row"><div><div class="row-title">${esc(d.sync.status)}</div><div class="meta">Last success ${esc(d.sync.lastSuccessAt||'Never')}</div></div><span class="pill ${d.sync.status==='success'?'on':'warn'}">${esc(d.sync.errorCode||'Healthy')}</span><button class="btn" data-module-jump="sync">Open Sync Center</button></div></div>`;$('content').querySelector('[data-module-jump]').onclick=()=>openModule('sync')}
      function renderSiteFeatures(rows){heading('Site Features','Control complete public sections independently from individual content records.');$('content').innerHTML+=`<div class="notice">Changes take effect through the public API after refresh. Existing content is preserved.</div><div class="band list">${rows.map(r=>{const on=String(r.Active).toLowerCase()!=='false';return `<div class="row"><div><div class="row-title">${esc(r.FeatureName)}</div><div class="meta">${esc(r.Description)} · order ${esc(r.DisplayOrder)}</div></div><span class="pill ${on?'on':''}">${on?'Active':'Inactive'}</span><button class="btn ${on?'danger':'primary'}" data-feature-toggle="${esc(r.FeatureKey)}" data-next="${on?'false':'true'}">${on?'Disable':'Enable'}</button></div>`}).join('')}</div>`;document.querySelectorAll('[data-feature-toggle]').forEach(button=>button.onclick=async()=>{const enabling=button.dataset.next==='true';if(!enabling&&!confirm(`Disable ${button.closest('.row').querySelector('.row-title').textContent}? This will hide it from the public portfolio.`))return;busy(button,true);try{await call('siteFeatures.update',{FeatureKey:button.dataset.featureToggle,Active:enabling});openModule('features')}catch(x){alert(x.message);busy(button,false)}})}
      function renderEntity(key,rows){const title=(modules.find(x=>x[0]===key)||[])[1]||key;heading(title,`Manage ${title.toLowerCase()} records.`,`<button class="btn primary" id="addRecord">Add</button>`);$('content').innerHTML+=`<div class="band list">${rows.length?rows.map(r=>recordRow(key,r)).join(''):'<div class="empty">No records</div>'}</div>`;$('addRecord').onclick=()=>editEntity(key,{});bindRows(key,rows)}
      function recordRow(key,r){const id=r.RecordID||r.media_id||r.seo_id||'';const name=r.Name||r.Title||r.Question||r.Degree||r.page_title||r.public_url||id;const active=('Active'in r?r.Active:'Published'in r?r.Published:'active'in r?r.active:true);return `<div class="row"><div><div class="row-title">${esc(name)}</div><div class="meta">${esc(r.Category||r.Company||r.Organization||r.scope||'')}</div></div><span class="pill ${String(active).toLowerCase()==='false'?'':'on'}">${String(active).toLowerCase()==='false'?'Inactive':'Active'}</span><div class="actions"><button class="btn" data-edit="${esc(id)}">Edit</button><button class="btn danger" data-archive="${esc(id)}">Archive</button></div></div>`}
      function bindRows(key,rows){$('content').onclick=e=>{const eb=e.target.closest('[data-edit]'),ab=e.target.closest('[data-archive]');if(eb){const row=rows.find(r=>String(r.RecordID||r.media_id||r.seo_id)===eb.dataset.edit);editEntity(key,row||{})}if(ab&&confirm('Archive this record?'))call('entity.archive',{entity:key,id:ab.dataset.archive}).then(()=>openModule(key)).catch(x=>alert(x.message))}}
      function editEntity(key,row){const fields=entityFields[key]||[];openEditor(`${row.RecordID||row.media_id||row.seo_id?'Edit':'Add'} ${(modules.find(x=>x[0]===key)||[])[1]||key}`,fields,row,async data=>{await call('entity.save',{entity:key,id:row.RecordID||row.media_id||row.seo_id,record:data});openModule(key)})}
      function renderObject(title,obj,command){heading(title,`Edit safe ${title.toLowerCase()} fields.`,`<button class="btn primary" id="editObject">Edit</button>`);$('content').innerHTML+=`<div class="band list">${Object.entries(obj).map(([k,v])=>`<div class="row"><b>${esc(k)}</b><div class="meta">${esc(v)}</div><span></span></div>`).join('')}</div>`;$('editObject').onclick=()=>openEditor(`Edit ${title}`,Object.keys(obj),obj,async data=>{await call(command,data);openModule(active)})}
      function renderProjects(data){heading('Projects','GitHub technical metadata is read-only. Portfolio presentation remains editable.');$('content').innerHTML+=projectBand('GitHub projects',data.github,true)+projectBand('Manual projects',data.manual,false);document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{const source=b.dataset.source;const list=source==='GITHUB'?data.github:data.manual;editProject(list.find(x=>x.id===b.dataset.project),source)});const add=document.createElement('button');add.className='btn primary';add.textContent='Add manual project';add.onclick=()=>editProject({id:'',record:{}},'MANUAL');$('content').querySelector('.heading').appendChild(add)}
      function projectBand(title,rows,github){return `<div class="band"><h2>${esc(title)}</h2><div class="list">${rows.map(p=>`<div class="row"><div style="display:flex;gap:10px;align-items:center">${p.thumbnail?`<img class="thumb" src="${esc(p.thumbnail)}" alt="">`:''}<div><div class="row-title">${esc(p.name)}</div><div class="meta">${esc(github?p.repoKey:p.id)} · ${esc(p.thumbnailSource||'fallback')}</div></div></div><div><span class="pill ${p.showOnPortfolio?'on':''}">${p.showOnPortfolio?'Published':'Unpublished'}</span> <span class="pill ${p.featured?'on':''}">${p.featured?'Featured':'Standard'}</span></div><div class="actions"><button class="btn" data-project="${esc(p.id)}" data-source="${github?'GITHUB':'MANUAL'}">Edit</button></div></div>`).join('')||'<div class="empty">No projects</div>'}</div></div>`}
      function editProject(p,source){const github=source==='GITHUB';const row=github?Object.assign({},p.curation,{github_repository_id:p.id}):Object.assign({},p.record||{},{manual_project_id:p.id});const fields=github?['show_on_portfolio','featured','display_order','section','category','custom_title','custom_description','portfolio_image','tech_stack_override','demo_url_override','kpi_highlight','portfolio_status','visibility_note','last_reviewed_at']:['title','description','category','display_order','featured','show_on_portfolio','kpi_highlight','image','image_alt','demo_url','tech_stack','portfolio_status','last_reviewed_at'];openEditor(`${github?'Curate':'Edit'} ${p.name||'manual project'}`,fields,row,async data=>{if(github){data.github_repository_id=p.id;await call('projects.github.update',data)}else{data.manual_project_id=p.id||('manual-'+Date.now());await call('projects.manual.save',data)}openModule('projects')})}
      async function renderAi(){const [prompt,knowledge]=await Promise.all([call('ai.prompt.read'),call('entity.list',{entity:'aiKnowledge'})]);heading('AI / Chat','Private prompt and knowledge remain server-side.');$('content').innerHTML+=`<div class="notice">Private AI content is visible only in this authenticated editor and is never returned by the public API.</div><div class="band"><h2>Private prompt</h2><button class="btn" id="editPrompt">Edit prompt</button></div><div class="band"><h2>Knowledge</h2><button class="btn primary" id="addKnowledge">Add</button><div class="list">${knowledge.map(r=>recordRow('aiKnowledge',r)).join('')}</div></div>`;$('editPrompt').onclick=()=>openEditor('Private AI prompt',Object.keys(prompt),prompt,async data=>{await call('ai.prompt.update',data);openModule('ai')});$('addKnowledge').onclick=()=>editEntity('aiKnowledge',{});bindRows('aiKnowledge',knowledge)}
      function renderSync(s){heading('GitHub Sync','Review status before requesting one controlled synchronization.');$('content').innerHTML+=`<div class="grid">${[['Status',s.status],['Repositories',s.repositoryCount],['Failures',s.failureCount],['HTTP',s.httpStatus||'—']].map(x=>`<div class="metric"><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('')}</div><div class="band"><div class="row"><div><div class="row-title">Last successful sync</div><div class="meta">${esc(s.lastSuccessAt||'Never')} · next estimate ${esc(s.nextScheduledEstimate||'Unknown')}</div></div><span class="pill ${s.status==='success'?'on':'warn'}">${esc(s.errorCode||s.status)}</span><button class="btn primary" id="syncNow">Sync now</button></div></div>`;$('syncNow').onclick=async e=>{if(!confirm('Run one GitHub synchronization now?'))return;busy(e.target,true);try{await call('sync.run');openModule('sync')}catch(x){alert(x.message);busy(e.target,false)}}}
      function renderActivity(rows){heading('Activity Log','Recent sanitized administration events.');$('content').innerHTML+=`<div class="band list">${rows.map(r=>`<div class="row"><div><div class="row-title">${esc(r.action)} · ${esc(r.entity)}</div><div class="meta">${esc(r.timestamp)} · ${esc(r.admin)}</div></div><span class="pill ${String(r.success)==='true'?'on':'warn'}">${String(r.success)==='true'?'Success':esc(r.error_code||'Failed')}</span><span class="meta">${esc(r.changed_fields||'')}</span></div>`).join('')||'<div class="empty">No activity</div>'}</div>`}
      function renderSecurity(){heading('Account / Security','Session and password controls.');$('content').innerHTML+=`<div class="band"><h2>Administrator</h2><p class="muted">${esc($('adminEmail').textContent)}</p><button class="btn warn" id="changeAgain">Change password</button></div>`;$('changeAgain').onclick=()=>$('passwordView').classList.remove('hidden')}
      function openEditor(title,fields,row,onSave){$('editorTitle').textContent=title;$('editorBody').innerHTML=fields.map(f=>fieldHtml(f,row[f])).join('');editorSave=onSave;$('editor').showModal()}
      function fieldHtml(name,value){const bool=/^(Active|Published|active|featured|show_on_portfolio)$/.test(name),long=/description|content|prompt|knowledge|bio|answer|achievements|keywords|visibility_note/i.test(name);if(bool)return `<label>${esc(name)}<select name="${esc(name)}"><option value="true" ${String(value).toLowerCase()==='true'?'selected':''}>Active / Yes</option><option value="false" ${String(value).toLowerCase()==='false'?'selected':''}>Inactive / No</option></select></label>`;return `<label class="${long?'wide':''}">${esc(name)}${long?`<textarea name="${esc(name)}">${esc(value||'')}</textarea>`:`<input name="${esc(name)}" value="${esc(value||'')}">`}</label>`}
      document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>$('editor').close());$('editorForm').onsubmit=async e=>{e.preventDefault();const b=$('saveButton');busy(b,true);const data=Object.fromEntries(new FormData(e.target).entries());Object.keys(data).forEach(k=>{if(/^(Active|Published|active|featured|show_on_portfolio)$/.test(k))data[k]=data[k]==='true'});try{await editorSave(data);$('editor').close()}catch(x){alert(x.message)}finally{busy(b,false)}};
      $('menuButton').onclick=()=>$('sidebar').classList.toggle('open');
      window.PORTFOLIO_ADMIN_API='https://script.google.com/macros/s/AKfycbwmQcArmH_TZ9Y8mP_XiyWgSCzU1QpmK7Iw3y5exUOKenl6p4ZOhTd7dxh-E8fpeJj1Mg/exec';
    })();
  </script>
</body>
