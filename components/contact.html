<section id="contact" class="py-20 px-6">
        <div class="container mx-auto max-w-2xl glass rounded-3xl p-8">
            <h2 id="contactSectionTitle" class="text-3xl font-bold text-center mb-8 gradient-text">Gateway Transmission</h2>
            <form id="contactForm" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <input type="text" id="name" placeholder="Your Name" aria-label="Your Name" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500" required>
                    <input type="email" id="email" placeholder="Your Email" aria-label="Your Email" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500" required>
                </div>
                <input type="text" id="subject" placeholder="Subject Vector" aria-label="Subject" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500" required>
                <textarea id="message" placeholder="Data Packet Body Content..." aria-label="Message" rows="5" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500" required></textarea>
                <button type="submit" id="submitBtn" class="w-full py-4 bg-gradient-to-r from-orange-500 to-pink-500 rounded-xl font-semibold flex items-center justify-center tracking-wide hover:opacity-90 transition shadow-lg">
                    Execute Secure Transmission
                </button>
            </form>
            <div id="formMessage" class="mt-4 p-4 rounded-xl text-center hidden animate-pulse"></div>
        </div>
    </section>
