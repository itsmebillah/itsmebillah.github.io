<section id="experience" class="py-20 px-6">
        <div class="container mx-auto max-w-4xl">
            <h2 id="experienceSectionTitle" class="text-3xl font-bold text-center mb-12 gradient-text">Experience & Academic Path</h2>
            <div class="timeline-container" id="timelineContainer"></div>
            <div class="career-data-ground" aria-hidden="true">
                <div class="career-root-label">ROOTED IN DATA</div>
                <div class="data-grass">
                    <span style="--grass-height: 2.5rem">=SUM(F:F)</span>
                    <span style="--grass-height: 3.6rem">=XLOOKUP(A2,A:A,F:F)</span>
                    <span style="--grass-height: 2.9rem">=QUERY(A:F,"select *")</span>
                    <span style="--grass-height: 4.2rem">=ARRAYFORMULA(A2:A*B2:B)</span>
                    <span style="--grass-height: 2.7rem">=IFERROR(value,0)</span>
                    <span style="--grass-height: 3.7rem">=FILTER(A:F,F:F&gt;0)</span>
                    <span style="--grass-height: 2.5rem">=INDEX(F:F,MATCH())</span>
                </div>
            </div>
        </div>
    </section>
