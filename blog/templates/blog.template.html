<!DOCTYPE html>
<html lang="{{language}}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{> seo}}
</head>
<body>
    <main id="blog-page" data-blog-slug="{{slug}}" data-blog-category="{{category}}">
        <article>
            <header>
                <p>{{category}}</p>
                <h1>{{title}}</h1>
                <p>{{description}}</p>
                <figure>
                    <img src="{{featuredImage}}" alt="{{featuredImageAlt}}" width="{{featuredImageWidth}}" height="{{featuredImageHeight}}" loading="eager" decoding="async" fetchpriority="high">
                </figure>
                <p>
                    <span>{{author}}</span>
                    <time datetime="{{publishDateIso}}">{{publishDate}}</time>
                </p>
            </header>
            <section>
                {{content}}
            </section>
        </article>
    </main>
</body>
</html>
