<!DOCTYPE html>
<html lang="{{language}}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{> seo}}
    <link rel="dns-prefetch" href="//cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link rel="dns-prefetch" href="//i.postimg.cc">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.postimg.cc">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../../assets/css/main.css" rel="stylesheet">
    <style>
        .article-shell { min-height: 100vh; padding: 6rem 1.25rem 3rem; }
        .article-container { width: min(100%, 980px); margin: 0 auto; }
        .article-meta { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; color: #9CA3AF; font-size: 0.82rem; }
        .article-hero-image { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 24px 70px rgba(0,0,0,0.34); }
        .article-content { color: #D1D5DB; font-size: 1.03rem; line-height: 1.9; max-width: 780px; margin: 0 auto; }
        .article-content p { margin: 0 0 1.25rem; }
        .article-content h1, .article-content h2, .article-content h3, .article-content h4 { color: #FFFFFF; font-weight: 800; line-height: 1.24; margin: 2.2rem 0 0.85rem; }
        .article-content h1 { font-size: 2rem; }
        .article-content h2 { font-size: 1.55rem; }
        .article-content h3 { font-size: 1.25rem; }
        .article-content ul, .article-content ol { margin: 0 0 1.35rem 1.35rem; padding-left: 1rem; }
        .article-content li { margin-bottom: 0.55rem; }
        .article-content a { color: #FF8B35; text-decoration: underline; text-underline-offset: 3px; }
        .article-content blockquote { margin: 1.6rem 0; padding: 1rem 1.25rem; border-left: 3px solid #FF6B35; background: rgba(255,255,255,0.045); border-radius: 0.75rem; color: #E5E7EB; }
        .article-content img { display: block; width: 100%; max-width: 100%; height: auto; object-fit: cover; border-radius: 0.85rem; margin: 1.75rem 0; border: 1px solid rgba(255,255,255,0.08); }
        .article-content pre { overflow-x: auto; margin: 1.4rem 0; padding: 1rem; border-radius: 0.85rem; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.08); }
        .article-content code { color: #FDBA74; }
        .article-card-link { display: block; height: 100%; }
        @media (max-width: 768px) {
            .article-shell { padding-top: 5rem; }
            .article-hero-image { aspect-ratio: 16 / 10; border-radius: 0.85rem; }
            .article-content { font-size: 0.98rem; line-height: 1.85; }
        }
    </style>
</head>
<body>
    <main class="article-shell" id="blog-page" data-blog-slug="{{slug}}" data-blog-category="{{category}}">
        <article class="article-container">
            <nav class="mb-8 text-xs text-gray-400" aria-label="Breadcrumb">
                <a href="../../" class="hover:text-white transition">Home</a>
                <span class="mx-2 text-gray-600">/</span>
                <a href="../" class="hover:text-white transition">Case Studies</a>
                <span class="mx-2 text-gray-600">/</span>
                <span class="text-orange-400">{{title}}</span>
            </nav>

            <header class="mb-10">
                <div class="mb-4">
                    <span class="inline-flex items-center rounded-full bg-orange-500/15 px-3 py-1 text-xs font-bold uppercase tracking-wider text-orange-400">{{category}}</span>
                </div>
                <h1 class="text-3xl md:text-5xl font-extrabold leading-tight text-white mb-5">{{title}}</h1>
                <p class="text-base md:text-lg text-gray-300 leading-relaxed max-w-3xl mb-6">{{description}}</p>
                <div class="article-meta mb-8">
                    <span>{{author}}</span>
                    <span aria-hidden="true">&middot;</span>
                    <time datetime="{{publishDateIso}}">{{publishDate}}</time>
                    <span aria-hidden="true">&middot;</span>
                    <span>{{readingTime}} min read</span>
                </div>
                <figure>
                    <img class="article-hero-image" src="{{featuredImage}}" alt="{{featuredImageAlt}}" width="{{featuredImageWidth}}" height="{{featuredImageHeight}}" loading="eager" decoding="async" fetchpriority="high">
                </figure>
            </header>

            <section class="article-content">
                {{content}}
            </section>

            <section class="mt-12 flex flex-wrap gap-3 items-center justify-between border-y border-white/10 py-5">
                <div class="flex flex-wrap gap-3">
                    <a class="magnetic-btn rounded-full bg-white/10 px-4 py-2 text-sm text-white hover:bg-white/15" href="{{share.linkedin}}" target="_blank" rel="noopener noreferrer">Share on LinkedIn</a>
                    <a class="magnetic-btn rounded-full bg-white/10 px-4 py-2 text-sm text-white hover:bg-white/15" href="{{share.x}}" target="_blank" rel="noopener noreferrer">Share on X</a>
                    <button class="magnetic-btn rounded-full bg-orange-500/20 px-4 py-2 text-sm text-orange-300 hover:bg-orange-500 hover:text-white" type="button" data-copy-link="{{canonical}}" aria-label="Copy article link">Copy Link</button>
                </div>
                <a class="magnetic-btn rounded-full bg-gradient-to-r from-orange-500 to-pink-500 px-5 py-2 text-sm font-semibold text-white" href="../">Back to Blog</a>
            </section>

            <nav class="mt-10 grid gap-4 md:grid-cols-2" aria-label="Article navigation">
                {{previousArticle}}
                {{nextArticle}}
            </nav>

            <section class="mt-12">
                <h2 class="text-2xl font-bold text-white mb-5">Related Articles</h2>
                <div class="grid gap-4 md:grid-cols-3">
                    {{relatedArticles}}
                </div>
            </section>
        </article>
    </main>
    <script>
        document.addEventListener('click', async event => {
            const button = event.target.closest('[data-copy-link]');
            if (!button) return;
            const url = button.getAttribute('data-copy-link');
            try {
                await navigator.clipboard.writeText(url);
                button.textContent = 'Copied';
                setTimeout(() => { button.textContent = 'Copy Link'; }, 1600);
            } catch (error) {
                window.prompt('Copy this link', url);
            }
        });
    </script>
</body>
</html>
